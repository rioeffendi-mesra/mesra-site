<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mesra Alam Sekitar — Zeroing and aligning a SICK DustHunter T100">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="10" fill="#2CB34A"/>

  <text x="80" y="118" font-family="'Roboto Mono',ui-monospace,Menlo,Consolas,monospace" font-size="22" letter-spacing="4" font-weight="600" fill="#1E7D33">CEMS INSIGHTS · FIELD PROCEDURE</text>

  <text x="80" y="212" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#1A1C1E" letter-spacing="-1.5">Zeroing &amp; aligning a</text>
  <text x="80" y="286" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#1A1C1E" letter-spacing="-1.5">SICK DustHunter T100</text>

  <text x="80" y="352" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#3c4247">The step-by-step field routine in SOPAS — measure, align the beam, set the</text>
  <text x="80" y="392" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="400" fill="#3c4247">100 % reference, and verify — the QAL3 zero that keeps dust data valid.</text>

  <!-- alignment target motif -->
  <g>
    <circle cx="1000" cy="250" r="120" fill="none" stroke="#E3E5E6" stroke-width="10"/>
    <circle cx="1000" cy="250" r="78" fill="none" stroke="#E3E5E6" stroke-width="8"/>
    <line x1="1000" y1="110" x2="1000" y2="390" stroke="#E3E5E6" stroke-width="3"/>
    <line x1="860" y1="250" x2="1140" y2="250" stroke="#E3E5E6" stroke-width="3"/>
    <circle cx="1000" cy="250" r="34" fill="#2CB34A"/>
  </g>

  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="80" y="440" width="300" height="96" rx="12" fill="#ffffff" stroke="#1E7D33" stroke-width="2.5"/>
    <text x="104" y="478" font-family="'Roboto Mono',ui-monospace,Menlo,monospace" font-size="17" letter-spacing="2" font-weight="600" fill="#1E7D33">ALIGN</text>
    <text x="104" y="512" font-size="26" font-weight="700" fill="#1A1C1E">Beam on centre</text>

    <text x="410" y="500" font-size="40" font-weight="700" fill="#1E7D33">&#8594;</text>

    <rect x="460" y="440" width="360" height="96" rx="12" fill="#E9F6EC" stroke="#1E7D33" stroke-width="2.5"/>
    <text x="484" y="478" font-family="'Roboto Mono',ui-monospace,Menlo,monospace" font-size="17" letter-spacing="2" font-weight="600" fill="#1E7D33">ZERO</text>
    <text x="484" y="512" font-size="26" font-weight="700" fill="#1A1C1E">Set 100 % reference</text>
  </g>

  <line x1="80" y1="576" x2="1120" y2="576" stroke="#E3E5E6" stroke-width="1.5"/>
  <text x="80" y="608" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#1A1C1E">MESRA <tspan font-weight="400" fill="#5F6062">Alam Sekitar</tspan></text>
  <text x="1120" y="608" text-anchor="end" font-family="'Roboto Mono',ui-monospace,Menlo,monospace" font-size="18" letter-spacing="2" font-weight="600" fill="#1E7D33">CLEAN. COMPLIANT. CONNECTED.</text>
</svg>
